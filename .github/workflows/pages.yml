name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v5
      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Website bauen
        run: npm run build
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v6
      - name: Website hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
